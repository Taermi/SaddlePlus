plugins {
    id 'java'
}

group = 'de.taermi.saddleplus'
version = '1.2.1'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}